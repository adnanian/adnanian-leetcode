# Runs daily (once every 24 hours) plus manual and repository_dispatch triggers.
# Edit the cron expression below if you want a different UTC time.
on:
  schedule:
    - cron: '0 0 * * *'  # daily at 00:00 UTC (change to desired UTC time)
  workflow_dispatch: {}
  repository_dispatch:
    types: [leetcode-sync]

permissions:
  contents: write  # allow the workflow to push changes to the repository

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (if you add requirements)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run LeetCode sync script
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
        run: |
          python scripts/sync_leetcode.py

      - name: Commit & push if changed
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          git config user.name "${GIT_USER_NAME:-github-actions[bot]}"
          git config user.email "${GIT_USER_EMAIL:-actions@github.com}"

          # If nothing changed, exit successfully
          if ! git status --porcelain | grep .; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "chore: sync LeetCode solutions (automated)"
          # Push to the default branch; change 'main' if your default branch is different
          git push origin HEAD:main
